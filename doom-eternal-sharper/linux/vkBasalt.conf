# DOOM Eternal Sharper - vkBasalt config
# Copy to ~/.config/vkBasalt/vkBasalt.conf (or next to the game as vkBasalt.conf)
# and launch with:  ENABLE_VKBASALT=1 %command%
#
# Effects run left to right.
# Default: CAS sharpening only, for use with the game's TAA left on (Profile A).
effects = cas

# TAA off (Profile B, launch option +r_antialiasing 0): put SMAA back in front
# of the sharpener to clean up edges. Comment the line above and uncomment this.
#effects = smaa:cas

# Press Home in-game to toggle the effects (X11 / XWayland only).
toggleKey = Home
enableOnLaunch = True
depthCapture = off

# Contrast Adaptive Sharpening strength.
# 0.0 = light, 1.0 = maximum (haloing). 0.45 undoes TAA blur without crunch.
# With TAA off, drop to 0.25-0.35.
casSharpness = 0.45

# SMAA (only used when "smaa" is in the effects list).
# luma is cheaper; color catches more edges, which helps on this game's
# glowing weapon and demon highlights.
smaaEdgeDetection = color
# Lower = more edges detected. 0.08 is a good balance; 0.05 catches everything.
smaaThreshold = 0.08
smaaMaxSearchSteps = 32
smaaMaxSearchStepsDiag = 16
smaaCornerRounding = 25

# FXAA (only used if you put "fxaa" in the effects list instead of smaa;
# cheaper but softer).
fxaaQualitySubpix = 0.50
fxaaQualityEdgeThreshold = 0.125
fxaaQualityEdgeThresholdMin = 0.0312
