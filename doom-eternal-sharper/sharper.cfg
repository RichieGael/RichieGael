// DOOM Eternal Sharper - console commands
//
// Open the console in-game with the tilde key (~, left of 1) and type a line,
// then Enter. Changes apply instantly but are NOT saved between sessions.
// To make them permanent, put the same cvars in the game's launch options
// with a leading "+" (see launch-options.txt).
//
// Profile B (Raw): turn the forced temporal anti-aliasing off.
// Crisper textures and distant detail, some jaggies and shimmer in return.
// Pair with in-game Sharpening 15-25, and with DSR/VSR, DLAA or the
// ReShade SMAA preset if the aliasing bothers you.
r_antialiasing 0

// Profile A (Clean TAA): the default. Use this to switch back for comparison.
// r_antialiasing 1

// Everything else that affects sharpness lives in Settings > Video and is
// saved by the game itself:
//   Resolution Scaling Mode  Off (or Static 100%)
//   Sharpening               50-70 with TAA on, 15-25 with TAA off
//   Chromatic Aberration     Off
//   Film Grain               0
//   Motion Blur              Off
//   DLSS Sharpening          30-50 (only shown when DLSS is enabled)

// Unrelated but handy: skip the startup logos.
// com_skipIntroVideo 1
